name: Release

# Push a tag vX.Y.Z (the version in package.json).
# - Job "release": tests, builds and packs the tarball (its README with
#   utm_source=npm, the copy npmjs.com shows), then creates the GitHub release
#   with the notes from CHANGELOG.md and the tarball attached.
# - Job "publish": publishes that same tarball to npm with trusted publishing
#   (GitHub's OIDC token, no npm token) and provenance. It runs only when the
#   repository variable NPM_PUBLISH is "true". See RELEASING.md.

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, pack, GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # the GitHub release
    outputs:
      name: ${{ steps.version.outputs.name }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@v7

      # No dependency cache in a release: a poisoned cache could change what gets published.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Check the tag against package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version in package.json ($version)."
            exit 1
          fi
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Release notes from CHANGELOG.md
        run: node scripts/changelog-notes.mjs "${{ steps.version.outputs.version }}" --release > "$RUNNER_TEMP/notes.md"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:widget
      - run: npm run build
      - run: npx --yes publint@0.3.25 --strict
      - run: npx --yes @arethetypeswrong/cli@0.18.5 --pack .

      # npmjs.com shows the README from the tarball: its links say utm_source=npm.
      # Only this checkout's copy changes, never the file in the repository.
      - name: README for npm (utm_source=npm)
        run: |
          sed -i 's/utm_source=github/utm_source=npm/g' README.md
          if grep -q 'utm_source=github' README.md; then
            echo "::error::README.md still has utm_source=github."
            exit 1
          fi

      - name: Pack
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          tarball="$(ls "$RUNNER_TEMP"/pack/*.tgz)"
          echo "tarball=$(basename "$tarball")" >> "$GITHUB_OUTPUT"
          sha256sum "$tarball"
          echo "Links in the packed README, by source:"
          tar -xOzf "$tarball" package/README.md | grep -o 'utm_source=[a-z]*' | sort | uniq -c

      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: ${{ runner.temp }}/pack/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          TARBALL: ${{ runner.temp }}/pack/${{ steps.pack.outputs.tarball }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::The release $GITHUB_REF_NAME already exists."
            exit 0
          fi
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$TARBALL" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${flags[@]}"

      - name: npm publishing is off
        if: vars.NPM_PUBLISH != 'true'
        run: echo "::notice::Not published to npm (the repository variable NPM_PUBLISH is not true). The tarball is on the GitHub release; see RELEASING.md."

  publish:
    name: Publish to npm
    needs: release
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The trusted publisher on npmjs.com names this environment: only this job can publish.
    environment: npm
    permissions:
      id-token: write # npm trusted publishing (OIDC) and provenance; nothing else
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11.21.1 && npm --version

      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: ${{ runner.temp }}/pack

      - name: Publish
        env:
          NAME: ${{ needs.release.outputs.name }}
          VERSION: ${{ needs.release.outputs.version }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
          TARBALL: ${{ runner.temp }}/pack/${{ needs.release.outputs.tarball }}
          # Empty in the steady state. Only for a first publish with provenance: a
          # one-day token saved as a secret of the "npm" environment, deleted after
          # the run (RELEASING.md). Trusted publishing is tried first either way.
          BOOTSTRAP_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          sha256sum "$TARBALL"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already on npm."
            exit 0
          fi
          if [ -n "$BOOTSTRAP_TOKEN" ]; then
            echo "::warning::The npm environment has an NPM_TOKEN secret. After this run, delete the secret and revoke the token on npmjs.com (RELEASING.md)."
            npm config set "//registry.npmjs.org/:_authToken" "$BOOTSTRAP_TOKEN"
          fi
          dist_tag=latest
          if [ "$PRERELEASE" = "true" ]; then dist_tag=next; fi
          npm publish "$TARBALL" --provenance --access public --tag "$dist_tag"
